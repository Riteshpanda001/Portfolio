server:
  port: 5000

spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # ── File upload limits ────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  # ── H2 console — DISABLED for security ──────────────────────
  h2:
    console:
      enabled: false   # Never expose in production!

  # ── Email / SMTP (Gmail) ──────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:riteshkumarpanda001@gmail.com}
    password: ${MAIL_PASSWORD:}          # Set via env var — use Gmail App Password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

# ── JWT ─────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:R1t3shP0rtf0l10S3cr3tK3yTh@t1sL0ng3n0ugh4JWT_MustBeAtLeast64BytesLongForHS512SecureAlgorithm!}
  expiration-ms: 86400000       # 24 hours
  refresh-expiration-ms: 604800000   # 7 days

# ── CORS ─────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173}

# ── Logging ──────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.ritesh.portfolio: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

