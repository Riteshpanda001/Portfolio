spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://riteshpanda.vercel.app}

admin:
  default-email: ${ADMIN_EMAIL:riteshkumarpanda001@gmail.com}
  default-password: ${ADMIN_PASSWORD}
  default-name: ${ADMIN_NAME:Ritesh Kumar Panda}

logging:
  level:
    root: INFO
    com.ritesh.portfolio: INFO
    org.springframework.security: INFO
