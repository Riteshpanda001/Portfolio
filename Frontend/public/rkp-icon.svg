<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06080F" />
    </linearGradient>

    <!-- Neon Stroke Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Monogram RKP Main Gradient -->
    <linearGradient id="rkp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#2D5BFF" />
      <stop offset="70%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Highlight Flare Gradient -->
    <linearGradient id="flare-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>



  <!-- Monogram R-K-P Graphic -->
  <g filter="url(#neon-glow)">
    <!-- LETTER R -->
    <path d="
      M 75 145
      H 150
      C 185 145, 205 162, 205 192
      C 205 220, 185 237, 150 237
      H 118
      V 367
      H 75
      Z
      M 118 181
      V 201
      H 146
      C 162 201, 168 197, 168 191
      C 168 185, 162 181, 146 181
      Z
    " fill="url(#rkp-grad)" />
    
    <path d="
      M 132 237
      L 198 367
      H 150
      L 106 280
      V 237
      Z
    " fill="url(#rkp-grad)" />

    <!-- LETTER K -->
    <path d="
      M 222 145
      H 263
      V 367
      H 222
      Z
    " fill="url(#rkp-grad)" />

    <path d="
      M 322 145
      L 252 240
      L 332 367
      H 282
      L 232 284
      L 232 225
      L 276 145
      Z
    " fill="url(#rkp-grad)" />

    <!-- LETTER P -->
    <path d="
      M 352 145
      H 427
      C 462 145, 482 165, 482 200
      C 482 235, 462 255, 427 255
      H 395
      V 367
      H 352
      Z
      M 395 181
      V 219
      H 422
      C 438 219, 444 212, 444 200
      C 444 188, 438 181, 422 181
      Z
    " fill="url(#rkp-grad)" />

    <!-- High-tech Flare Lines across the top of RKP -->
    <path d="M 75 145 H 205 M 222 145 H 332 M 352 145 H 482" stroke="url(#flare-grad)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
